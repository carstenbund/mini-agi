[project]
name = "symbolic-recursion"
version = "0.1.0"
description = "Symbolic Memory Core — proto-AGI skeleton with novelty/confidence harness"
requires-python = ">=3.9"
readme = "README.md"
dependencies = ["numpy"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["symbolic_recursion"]
include-package-data = true

[project.optional-dependencies]
sbert = ["sentence-transformers>=2.2.2"]
faiss = ["faiss-cpu"]
chroma = ["chromadb>=0.5.0"]
test = ["pytest>=8.0"]
